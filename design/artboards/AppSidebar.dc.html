<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Conversations" style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; background: #12161D; border-right: 1px solid #262E3A; font-family: 'IBM Plex Sans', sans-serif; color: #F4F6F9;">
<sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
<div style="height: {{h}}px; box-sizing: border-box; padding: 20px 14px 16px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px;">
<div style="width: 32px; height: 32px; border-radius: 9px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(78,142,247,0.35), 0 6px 18px rgba(78,142,247,0.25);"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="19" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="4" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="17" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="13" y="12" width="6" height="6" rx="1.5" fill="#2F6FD8"></rect><path d="M16 12.5v5" stroke="#0D0630" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"></path><circle cx="9.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="22.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="9.5" cy="20.5" r="1.8" fill="#0D0630"></circle><circle cx="22.5" cy="20.5" r="1.8" fill="#0D0630"></circle><path d="M20.3 18.6a3 3 0 0 1 1.9-1.1" stroke="#4E8EF7" stroke-width="1.1" stroke-linecap="round" fill="none"></path><circle cx="10.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle><circle cx="23.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle></svg></div>
<div style="display: flex; flex-direction: column;">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em;">World Cup AI Scout</span>
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #95A0B3;">2026 edition</span>
</div>
</div>
<button type="button" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: #1A2029; border: 1px solid #3A4456; border-radius: 10px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 rgba(244,246,249,0.05);"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg><span style="flex-grow: 1; text-align: left;">New chat</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #95A0B3; padding: 2px 6px; border: 1px solid #3A4456; border-radius: 4px;">⌘K</span></button>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="padding: 0 10px 6px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #95A0B3;">{{g.label}}</span>
<sc-for list="{{g.items}}" as="c" hint-placeholder-count="3">
<a href="#chat" style="height: 40px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 8px; background: {{c.bg}}; color: {{c.ink}}; text-decoration: none; font-size: 14px; line-height: 20px;"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="{{c.icon}}" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="{{c.path}}"></path></svg><span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span></a>
</sc-for>
</div>
</sc-for>
</div>
<div style="padding: 14px; border-radius: 12px; background: #1A2029; border: 1px solid #262E3A; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 1px 0 rgba(244,246,249,0.04);">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #95A0B3;">Dataset</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<div style="display: flex; flex-direction: column;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 22px; font-weight: 600;">104</span><span style="font-size: 11px; color: #95A0B3;">matches</span></div>
<div style="display: flex; flex-direction: column;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 22px; font-weight: 600;">48</span><span style="font-size: 11px; color: #95A0B3;">teams</span></div>
<div style="display: flex; flex-direction: column;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 22px; font-weight: 600;">16</span><span style="font-size: 11px; color: #95A0B3;">cities</span></div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px;">
<div style="width: 32px; height: 32px; border-radius: 9999px; background: #232A35; border: 1px solid #3A4456; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600;">[AB]</div>
<span style="flex-grow: 1; font-size: 14px; color: #ABB4C4;">[Your name]</span>
<button type="button" aria-label="Settings" title="Settings" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #1A2029; border: 1px solid #3A4456; border-radius: 10px; color: #ABB4C4; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
</div>
</div>
</sc-if>
<sc-if value="{{collapsed}}" hint-placeholder-val="{{false}}">
<div style="height: {{h}}px; box-sizing: border-box; padding: 20px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(78,142,247,0.35), 0 6px 18px rgba(78,142,247,0.25);"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="19" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="4" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="17" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="13" y="12" width="6" height="6" rx="1.5" fill="#2F6FD8"></rect><path d="M16 12.5v5" stroke="#0D0630" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"></path><circle cx="9.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="22.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="9.5" cy="20.5" r="1.8" fill="#0D0630"></circle><circle cx="22.5" cy="20.5" r="1.8" fill="#0D0630"></circle><path d="M20.3 18.6a3 3 0 0 1 1.9-1.1" stroke="#4E8EF7" stroke-width="1.1" stroke-linecap="round" fill="none"></path><circle cx="10.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle><circle cx="23.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle></svg></div>
<button type="button" aria-label="New chat" style="margin-top: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #1A2029; border: 1px solid #3A4456; border-radius: 10px; color: #F4F6F9;"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg></button>
<button type="button" aria-label="Chat history" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 10px; color: #ABB4C4;"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><circle cx="10" cy="10" r="6.5"></circle><path d="M10 6.5V10l2.5 1.5"></path></svg></button>
<div style="flex-grow: 1;"></div>
<button type="button" aria-label="Settings" title="Settings" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #1A2029; border: 1px solid #3A4456; border-radius: 10px; color: #ABB4C4; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
<div style="width: 32px; height: 32px; border-radius: 9999px; background: #232A35; border: 1px solid #3A4456; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600;">[AB]</div>
</div>
</sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"collapsed":{"editor":"boolean","default":false},"h":{"editor":"int","default":900,"min":600,"max":4000},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const collapsed = this.props.collapsed ?? false;
    const shield = 'M10 3l6 2.5V10c0 3.5-2.6 6-6 7-3.4-1-6-3.5-6-7V5.5z';
    const pitch = 'M3 5h14v10H3zM10 5v10';
    const bars = 'M5 16V9M10 16V4M15 16v-5';
    const person = 'M10 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6M4.5 16.5c0.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5';
    const item = (title, path, active) => ({
      title, path,
      bg: active ? '#1A2029' : 'transparent',
      ink: active ? '#F4F6F9' : '#ABB4C4',
      icon: active ? '#7E6FEE' : '#95A0B3'
    });
    const groups = [
      { label: 'Today', items: [item('Argentina defence', shield, true), item('France vs Spain semifinal', pitch), item('Messi vs Mbappé', bars)] },
      { label: 'Earlier', items: [item('Top keepers by saves', person), item('Knockout upsets', pitch), item('Mbappé tournament', person)] }
    ];
    return { w: collapsed ? 72 : 264, h: this.props.h ?? 900, collapsed, expanded: !collapsed, groups };
  }
}
</script>
</body>
</html>
