<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team analysis widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<article aria-label="Team analysis: Argentina" style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; background: #1A2029; border: 1px solid #262E3A; border-radius: 16px; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #F4F6F9; box-shadow: inset 0 1px 0 rgba(244,246,249,0.06), 0 8px 24px rgba(2,3,5,0.55);">
<div style="flex-shrink: 0; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, rgba(78,142,247,0.10) 0%, rgba(78,142,247,0) 100%); border-bottom: 1px solid #262E3A;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #95A0B3;"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#4E8EF7" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M10 3l6 2.5V10c0 3.5-2.6 6-6 7-3.4-1-6-3.5-6-7V5.5z"></path></svg>Team analysis</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 500; color: #95A0B3;">WC 2026 · 7 matches</span>
</div>
<div style="display: flex; align-items: center; gap: 14px;">
<div style="width: 56px; height: 56px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; background: #232A35; border: 1px solid #3A4456; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; box-shadow: inset 0 1px 0 rgba(244,246,249,0.08);">ARG</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em;">Argentina</span>
<span style="font-size: 13px; line-height: 18px; color: #ABB4C4;">Semifinalist · out 1–2 to Brazil</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">5<span style="color: #95A0B3;">–</span>1<span style="color: #95A0B3;">–</span>1</span>
<span style="height: 22px; padding: 0 8px; display: flex; align-items: center; border-radius: 9999px; background: rgba(53,209,142,0.12); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #35D18E;">▲ +9 GD</span>
</div>
</div>
</div>
<div style="flex-shrink: 0; margin: 16px 20px 0; display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); background: #12161D; border: 1px solid #262E3A; border-radius: 12px; overflow: hidden;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset -1px 0 0 #262E3A, inset 0 -1px 0 #262E3A;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #95A0B3;">{{c.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; line-height: 26px; font-weight: 600;">{{c.value}}</span>
<span style="font-size: 12px; line-height: 16px; color: #95A0B3;">{{c.note}}</span>
</div>
</sc-for>
</div>
<div style="flex-grow: 1; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #95A0B3;">Goals for vs against, by match</span>
<div style="display: flex; gap: 12px; font-size: 12px; line-height: 16px; color: #ABB4C4;">
<span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; background: #35D18E; border-radius: 9999px;"></span>▲ For</span>
<span style="display: flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; background: #FF7A6B; border-radius: 9999px;"></span>▼ Against</span>
</div>
</div>
<div style="display: flex; gap: 6px;">
<sc-for list="{{matches}}" as="m" hint-placeholder-count="7">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center;">
<div style="height: 64px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 14px; font-weight: 600; color: #35D18E;">{{m.gf}}</span>
<div style="width: 20px; height: {{m.gfH}}; background: linear-gradient(180deg, #35D18E, rgba(53,209,142,0.55)); border-radius: 4px 4px 0 0;"></div>
</div>
<div style="width: 100%; height: 1px; background: #3A4456;"></div>
<div style="height: 50px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 4px;">
<div style="width: 20px; height: {{m.gaH}}; background: linear-gradient(0deg, #FF7A6B, rgba(255,122,107,0.55)); border-radius: 0 0 4px 4px;"></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 14px; font-weight: 600; color: #FF7A6B;">{{m.ga}}</span>
</div>
<span style="margin-top: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 14px; font-weight: 500; color: #95A0B3;">{{m.code}}</span>
</div>
</sc-for>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 12px 20px; border-top: 1px solid #262E3A; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(18,22,29,0.6);">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: #95A0B3;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #35D18E;"></span>Group stage to semifinal</span>
<sc-if value="{{notActive}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #232A35; border: 1px solid #3A4456; border-radius: 10px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 16px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 rgba(244,246,249,0.06);">Open details<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"></path></svg></button>
</sc-if>
<sc-if value="{{active}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: rgba(78,142,247,0.14); border: 1px solid rgba(78,142,247,0.45); border-radius: 10px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 16px; font-weight: 600; cursor: pointer;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #4E8EF7; box-shadow: 0 0 0 3px rgba(78,142,247,0.25);"></span>Showing in panel</button>
</sc-if>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":640,"min":320,"max":760,"section":"Size"},"h":{"editor":"int","default":500,"min":300,"max":900,"section":"Size"},"active":{"editor":"boolean","default":false},"$preview":{"width":640,"height":500}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.w ?? 640;
    const h = this.props.h ?? 500;
    const active = this.props.active ?? false;
    const unit = 14;
    const rows = [['ALG', 3, 0], ['AUT', 2, 0], ['JOR', 1, 1], ['NGA', 3, 1], ['MEX', 2, 0], ['NED', 2, 1], ['BRA', 1, 2]];
    const chips = [
      { label: 'Conceded / game', value: '0.71', note: 'Field 1.34' },
      { label: 'Clean sheets', value: '3', note: 'of 7 matches' },
      { label: 'Possession', value: '58.4%', note: 'Field 50.0%' },
      { label: 'Shots / game', value: '15.3', note: 'Field 12.4' }
    ];
    return {
      w, h, active, notActive: !active, chips,
      cols: w < 480 ? 2 : 4,
      matches: rows.map(([code, gf, ga]) => ({ code, gf, ga, gfH: gf * unit + 'px', gaH: ga * unit + 'px' }))
    };
  }
}
</script>
</body>
</html>
