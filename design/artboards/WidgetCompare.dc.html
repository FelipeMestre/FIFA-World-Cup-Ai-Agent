<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player comparison widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<article aria-label="Player comparison: Lionel Messi and Kylian Mbappé" style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; background: #1A2029; border: 1px solid #262E3A; border-radius: 16px; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #F4F6F9; box-shadow: inset 0 1px 0 rgba(244,246,249,0.06), 0 8px 24px rgba(2,3,5,0.55);">
<div style="flex-shrink: 0; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 16px; background: linear-gradient(90deg, rgba(78,142,247,0.14) 0%, rgba(78,142,247,0) 45%, rgba(171,180,196,0) 55%, rgba(171,180,196,0.10) 100%); border-bottom: 1px solid #262E3A;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #95A0B3;"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#4E8EF7" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M5 16V9M10 16V4M15 16v-5"></path></svg>Player comparison</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 500; color: #95A0B3;">Per 90 · forwards</span>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px;">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
<div style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 9999px; padding: 2px; background: #4E8EF7;"><div style="width: 100%; height: 100%; border-radius: 9999px; background: #232A35; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700;">LM</div></div>
<div style="display: flex; flex-direction: column;">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em;">Lionel Messi</span>
<span style="font-size: 13px; line-height: 18px; color: #ABB4C4;">Argentina · 598 min</span>
</div>
</div>
<span style="width: 40px; height: 40px; border-radius: 9999px; background: #12161D; border: 1px solid #3A4456; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: #ABB4C4;">VS</span>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right;">
<div style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 9999px; padding: 2px; background: #ABB4C4;"><div style="width: 100%; height: 100%; border-radius: 9999px; background: #232A35; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700;">KM</div></div>
<div style="display: flex; flex-direction: column;">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em;">Kylian Mbappé</span>
<span style="font-size: 13px; line-height: 18px; color: #ABB4C4;">France · 612 min</span>
</div>
</div>
</div>
</div>
<div style="flex-grow: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #95A0B3;">Where they differ most</span>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 500;">{{r.label}}</span>
<span style="height: 22px; padding: 0 8px; display: flex; align-items: center; border-radius: 9999px; background: {{r.leadBg}}; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: {{r.leadKey}};">▲ {{r.delta}} {{r.leader}}</span>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<span style="width: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; line-height: 20px; font-weight: 600; color: {{r.aInk}};">{{r.a}}</span>
<div style="flex: 1 1 0; height: 10px; display: flex; justify-content: flex-end; background: #12161D; border-radius: 9999px 2px 2px 9999px;"><div style="width: {{r.aW}}; background: linear-gradient(90deg, rgba(78,142,247,0.5), #4E8EF7); border-radius: 9999px 2px 2px 9999px;"></div></div>
<div style="flex: 1 1 0; height: 10px; display: flex; background: #12161D; border-radius: 2px 9999px 9999px 2px;"><div style="width: {{r.bW}}; background: linear-gradient(90deg, #ABB4C4, rgba(171,180,196,0.5)); border-radius: 2px 9999px 9999px 2px;"></div></div>
<span style="width: 44px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 15px; line-height: 20px; font-weight: 600; color: {{r.bInk}};">{{r.b}}</span>
</div>
</div>
</sc-for>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<div style="padding: 10px 12px; border-radius: 12px; background: rgba(78,142,247,0.08); border: 1px solid rgba(78,142,247,0.25); display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 22px; font-weight: 600;">97th</span><span style="font-size: 12px; line-height: 16px; color: #ABB4C4;">Messi · assists per 90</span></div>
<div style="padding: 10px 12px; border-radius: 12px; background: rgba(171,180,196,0.08); border: 1px solid rgba(171,180,196,0.25); display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 22px; font-weight: 600;">94th</span><span style="font-size: 12px; line-height: 16px; color: #ABB4C4;">Mbappé · goals per 90</span></div>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 12px 20px; border-top: 1px solid #262E3A; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(18,22,29,0.6);">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: #95A0B3;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #35D18E;"></span>Percentile among forwards, 270+ min</span>
<sc-if value="{{notActive}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #232A35; border: 1px solid #3A4456; border-radius: 10px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 16px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 rgba(244,246,249,0.06);">Open details<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"></path></svg></button>
</sc-if>
<sc-if value="{{active}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: rgba(78,142,247,0.14); border: 1px solid rgba(78,142,247,0.45); border-radius: 10px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 16px; font-weight: 600; cursor: pointer;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #4E8EF7; box-shadow: 0 0 0 3px rgba(78,142,247,0.25);"></span>Showing in panel</button>
</sc-if>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":640,"min":320,"max":760,"section":"Size"},"h":{"editor":"int","default":640,"min":300,"max":900,"section":"Size"},"active":{"editor":"boolean","default":false},"$preview":{"width":640,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.w ?? 640;
    const h = this.props.h ?? 640;
    const active = this.props.active ?? false;
    const A = '#4E8EF7', B = '#ABB4C4', lead = '#F4F6F9', trail = '#95A0B3';
    const raw = [
      { label: 'Assists per 90', a: 0.60, b: 0.29 },
      { label: 'Shots per 90', a: 3.61, b: 4.26 },
      { label: 'G+A per 90', a: 1.35, b: 1.18 },
      { label: 'Goals per 90', a: 0.75, b: 0.88 }
    ];
    const rows = raw.map((r) => {
      const max = Math.max(r.a, r.b);
      const aLeads = r.a >= r.b;
      return {
        label: r.label, a: r.a.toFixed(2), b: r.b.toFixed(2),
        aW: Math.round((r.a / max) * 100) + '%', bW: Math.round((r.b / max) * 100) + '%',
        aInk: aLeads ? lead : trail, bInk: aLeads ? trail : lead,
        leader: aLeads ? 'Messi' : 'Mbappé', leadKey: aLeads ? A : B,
        leadBg: aLeads ? 'rgba(78,142,247,0.12)' : 'rgba(171,180,196,0.12)',
        delta: '+' + Math.abs(r.a - r.b).toFixed(2)
      };
    });
    return { w, h, active, notActive: !active, rows };
  }
}
</script>
</body>
</html>
