<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, active thread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0A0D12}
a{color:#4E8EF7}a:hover{color:#7FADF9}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #4E8EF7;outline-offset:2px}
textarea::placeholder{color:#95A0B3}
</style>
</helmet>
<div style="width: 1440px; height: 3440px; box-sizing: border-box; display: flex; background: #0A0D12; font-family: 'IBM Plex Sans', sans-serif; color: #F4F6F9;">
<dc-import name="AppSidebar" h="{{3440}}" hint-size="264px,3440px"></dc-import>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(720px 420px at 50% -160px, rgba(126,111,238,0.16), rgba(126,111,238,0) 70%), #0A0D12;">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 12px; background: rgba(10,13,18,0.72); border-bottom: 1px solid #262E3A; backdrop-filter: blur(12px);">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Argentina defence</span>
<span style="height: 24px; padding: 0 8px; display: flex; align-items: center; border-radius: 9999px; background: #1A2029; border: 1px solid #262E3A; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #95A0B3;">4 answers</span>
<div style="flex-grow: 1;"></div>
<button type="button" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid #3A4456; border-radius: 10px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 12v5h12v-5"></path></svg>Share</button>
</header>
<main style="flex-grow: 1; width: 760px; margin: 0 auto; padding: 40px 0; display: flex; flex-direction: column; gap: 36px;">
<sc-for list="{{turns}}" as="t" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; justify-content: flex-end;"><div style="max-width: 520px; padding: 12px 18px; background: #211A3E; border: 1px solid rgba(126,111,238,0.28); border-radius: 18px 18px 4px 18px; font-size: 16px; line-height: 24px;">{{t.q}}</div></div>
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; gap: 10px;">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(78,142,247,0.3);"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="19" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="4" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="17" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="13" y="12" width="6" height="6" rx="1.5" fill="#2F6FD8"></rect><path d="M16 12.5v5" stroke="#0D0630" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"></path><circle cx="9.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="22.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="9.5" cy="20.5" r="1.8" fill="#0D0630"></circle><circle cx="22.5" cy="20.5" r="1.8" fill="#0D0630"></circle><path d="M20.3 18.6a3 3 0 0 1 1.9-1.1" stroke="#4E8EF7" stroke-width="1.1" stroke-linecap="round" fill="none"></path><circle cx="10.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle><circle cx="23.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle></svg></span>
<span style="font-size: 14px; font-weight: 600;">Scout</span>
<span style="height: 22px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border-radius: 9999px; background: #12161D; border: 1px solid #262E3A; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #95A0B3;"><span style="width: 5px; height: 5px; border-radius: 9999px; background: #35D18E;"></span>{{t.source}}</span>
</div>
<p style="margin: 0; max-width: 680px; font-size: 16px; line-height: 26px; color: #ABB4C4;"><strong style="font-weight: 600; color: #F4F6F9;">{{t.lead}}</strong> {{t.rest}}</p>
<sc-if value="{{t.isTeam}}" hint-placeholder-val="{{false}}"><dc-import name="WidgetTeam" w="{{640}}" h="{{500}}" hint-size="640px,500px"></dc-import></sc-if>
<sc-if value="{{t.isMatch}}" hint-placeholder-val="{{false}}"><dc-import name="WidgetMatch" w="{{640}}" h="{{560}}" hint-size="640px,560px"></dc-import></sc-if>
<sc-if value="{{t.isPlayer}}" hint-placeholder-val="{{false}}"><dc-import name="WidgetPlayer" w="{{640}}" h="{{400}}" hint-size="640px,400px"></dc-import></sc-if>
<sc-if value="{{t.isCompare}}" hint-placeholder-val="{{false}}"><dc-import name="WidgetCompare" w="{{640}}" h="{{640}}" hint-size="640px,640px"></dc-import></sc-if>
<div style="display: flex; align-items: center; gap: 4px; color: #95A0B3;">
<button type="button" aria-label="Copy answer" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: inherit; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"></rect><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path></svg></button>
<button type="button" aria-label="Regenerate" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: inherit; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4"></path></svg></button>
<span style="margin-left: 8px; font-size: 13px;">{{t.follow}}</span>
</div>
</div>
</div>
</sc-for>
</main>
<div style="position: sticky; bottom: 0; flex-shrink: 0; padding: 20px 0 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(180deg, rgba(10,13,18,0) 0%, #0A0D12 40%);">
<div style="width: 760px; box-sizing: border-box; padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 10px; background: #1A2029; border: 1px solid #3A4456; border-radius: 20px; box-shadow: 0 24px 60px rgba(2,3,5,0.6), inset 0 1px 0 rgba(244,246,249,0.06);">
<label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Ask a follow-up</label>
<textarea id="ask" rows="1" placeholder="Ask a follow-up…" style="flex-grow: 1; height: 44px; box-sizing: border-box; padding: 10px 0; resize: none; background: transparent; border: 0; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; line-height: 24px;"></textarea>
<button type="button" style="height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: #232A35; border: 1px solid #3A4456; border-radius: 9999px; color: #ABB4C4; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; cursor: pointer;"><span style="font-family: 'IBM Plex Mono', monospace; color: #F4F6F9;">@</span>Mention</button>
<button type="button" aria-label="Send" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #7E6FEE; border: 0; border-radius: 14px; color: #0D0630; cursor: pointer; box-shadow: 0 6px 18px rgba(126,111,238,0.45), inset 0 1px 0 rgba(255,255,255,0.25);"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"></path></svg></button>
</div>
<span style="font-size: 12px; line-height: 16px; color: #95A0B3;">Covers results, events, lineups and match stats. No passing or tracking data.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3440}}'>
class Component extends DCLogic {
  renderVals() {
    const turn = (kind, q, source, lead, rest, follow) => ({
      q, source, lead, rest, follow,
      isTeam: kind === 'team', isMatch: kind === 'match', isPlayer: kind === 'player', isCompare: kind === 'compare'
    });
    const turns = [
      turn('team', 'How did Argentina perform defensively?', '7 matches', '5 goals conceded in 7 matches,', '0.71 per game, with 3 clean sheets. Their only multi-goal concession came in the 1–2 semifinal loss to Brazil.', 'Follow up: How did they do in the semifinal?'),
      turn('match', 'Show me the France vs Spain semifinal breakdown', '1 match · 12 events', 'Spain won 2–1', 'with 56% possession and 16 shots to France’s 11. Lamine Yamal opened the scoring on 23’ and was named player of the match.', 'Follow up: Who came off the bench?'),
      turn('player', 'What about Mbappé’s tournament?', '7 apps · 612 min', '6 goals and 2 assists in 612 minutes,', '1.18 goal contributions per 90. That puts him in the top 10% of forwards.', 'Follow up: Compare him with Messi'),
      turn('compare', 'Compare Messi vs Mbappé', '2 players · per 90', '0.60 vs 0.29 assists per 90:', 'creating chances is the biggest gap. Mbappé shoots more, 4.26 shots per 90 to Messi’s 3.61.', 'Follow up: Who has the better shot accuracy?')
    ];
    return { turns };
  }
}
</script>
</body>
</html>
