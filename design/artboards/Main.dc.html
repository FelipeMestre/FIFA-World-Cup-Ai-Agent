<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, empty state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0A0D12}
a{color:#4E8EF7}a:hover{color:#7FADF9}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #4E8EF7;outline-offset:2px}
textarea::placeholder{color:#95A0B3}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0A0D12; font-family: 'IBM Plex Sans', sans-serif; color: #F4F6F9; overflow: hidden;">
<dc-import name="AppSidebar" h="{{900}}" hint-size="264px,900px"></dc-import>
<div style="flex-grow: 1; min-width: 0; position: relative; display: flex; flex-direction: column; background: radial-gradient(720px 420px at 50% -120px, rgba(126,111,238,0.22), rgba(126,111,238,0) 70%), radial-gradient(520px 360px at 100% 100%, rgba(78,142,247,0.10), rgba(78,142,247,0) 70%), #0A0D12;">
<svg width="1176" height="900" viewBox="0 0 1176 900" fill="none" stroke="#F4F6F9" stroke-opacity="0.035" stroke-width="1.5" aria-hidden="true" style="position: absolute; inset: 0;"><circle cx="588" cy="520" r="180"></circle><path d="M0 520H1176"></path><circle cx="588" cy="520" r="4" fill="#F4F6F9" fill-opacity="0.05"></circle></svg>
<header style="position: relative; height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
<span style="height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 9999px; background: rgba(26,32,41,0.7); border: 1px solid #262E3A; font-size: 13px; color: #ABB4C4;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #35D18E; box-shadow: 0 0 0 3px rgba(53,209,142,0.2);"></span>Tournament data up to date</span>
</header>
<main style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 0 48px 56px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
<span style="height: 30px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px; border-radius: 9999px; background: rgba(126,111,238,0.12); border: 1px solid rgba(126,111,238,0.35); font-size: 13px; font-weight: 500; color: #F4F6F9;"><span style="width: 20px; height: 20px; border-radius: 9999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="19" y="4.5" width="6" height="6" rx="1.6" fill="#4E8EF7"></rect><rect x="4" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="17" y="9" width="11" height="17.5" rx="5.5" fill="#4E8EF7"></rect><rect x="13" y="12" width="6" height="6" rx="1.5" fill="#2F6FD8"></rect><path d="M16 12.5v5" stroke="#0D0630" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"></path><circle cx="9.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="22.5" cy="20.5" r="4" fill="#FFFFFF" stroke="#0D0630" stroke-width="1.2"></circle><circle cx="9.5" cy="20.5" r="1.8" fill="#0D0630"></circle><circle cx="22.5" cy="20.5" r="1.8" fill="#0D0630"></circle><path d="M20.3 18.6a3 3 0 0 1 1.9-1.1" stroke="#4E8EF7" stroke-width="1.1" stroke-linecap="round" fill="none"></path><circle cx="10.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle><circle cx="23.3" cy="19.7" r="0.6" fill="#FFFFFF"></circle></svg></span>Your World Cup 2026 analyst</span>
<h1 style="margin: 0; max-width: 760px; font-family: 'Space Grotesk', sans-serif; font-size: 52px; line-height: 56px; font-weight: 700; letter-spacing: -0.03em;">Every match, player and team, <span style="color: #998DF2;">one question away.</span></h1>
<p style="margin: 0; max-width: 560px; font-size: 17px; line-height: 26px; color: #ABB4C4;">Ask in plain words. Answers come back as numbers, charts and match breakdowns you can open in detail.</p>
</div>
<div style="width: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #1A2029; border: 1px solid #3A4456; border-radius: 20px; box-shadow: 0 0 0 6px rgba(126,111,238,0.06), 0 24px 60px rgba(2,3,5,0.6), inset 0 1px 0 rgba(244,246,249,0.06);">
<label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Ask a question</label>
<textarea id="ask" rows="2" placeholder="Ask about a team, match or player…" style="height: 72px; box-sizing: border-box; padding: 20px 22px 0; resize: none; background: transparent; border: 0; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; line-height: 26px;"></textarea>
<div style="padding: 10px 12px 12px 16px; display: flex; align-items: center; gap: 8px;">
<button type="button" style="height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: #232A35; border: 1px solid #3A4456; border-radius: 9999px; color: #ABB4C4; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; cursor: pointer;"><span style="font-family: 'IBM Plex Mono', monospace; color: #F4F6F9;">@</span>Team or player</button>
<button type="button" style="height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: #232A35; border: 1px solid #3A4456; border-radius: 9999px; color: #ABB4C4; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><rect x="3" y="4" width="14" height="13"></rect><path d="M3 8h14M7 2v4M13 2v4"></path></svg>All stages</button>
<div style="flex-grow: 1;"></div>
<span style="font-size: 12px; color: #95A0B3;"><span style="font-family: 'IBM Plex Mono', monospace; padding: 1px 5px; border: 1px solid #3A4456; border-radius: 4px;">⏎</span> to send</span>
<button type="button" aria-label="Send" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #7E6FEE; border: 0; border-radius: 12px; color: #0D0630; cursor: pointer; box-shadow: 0 6px 18px rgba(126,111,238,0.45), inset 0 1px 0 rgba(255,255,255,0.25);"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"></path></svg></button>
</div>
</div>
<div style="width: 760px; display: flex; flex-direction: column; gap: 12px;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #95A0B3;">Try asking</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{prompts}}" as="p" hint-placeholder-count="4">
<button type="button" style="min-height: 72px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; background: rgba(26,32,41,0.72); border: 1px solid #262E3A; border-radius: 14px; color: #F4F6F9; font-family: 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer; box-shadow: inset 0 1px 0 rgba(244,246,249,0.04);">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="{{p.ink}}" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 15px; line-height: 20px; font-weight: 600;">{{p.title}}</span><span style="font-size: 13px; line-height: 18px; color: #95A0B3;">{{p.hint}}</span></span>
<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#95A0B3" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
</button>
</sc-for>
</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const blue = { tint: 'rgba(78,142,247,0.14)', ink: '#4E8EF7' };
    const violet = { tint: 'rgba(126,111,238,0.16)', ink: '#998DF2' };
    const green = { tint: 'rgba(53,209,142,0.12)', ink: '#35D18E' };
    const silver = { tint: 'rgba(171,180,196,0.12)', ink: '#ABB4C4' };
    const prompts = [
      { title: 'Compare Messi vs Mbappé', hint: 'Player comparison · per 90', icon: 'M5 16V9M10 16V4M15 16v-5', ...violet },
      { title: 'How did Argentina perform defensively?', hint: 'Team analysis · 7 matches', icon: 'M10 3l6 2.5V10c0 3.5-2.6 6-6 7-3.4-1-6-3.5-6-7V5.5z', ...blue },
      { title: 'France vs Spain semifinal breakdown', hint: 'Match analysis · events and lineups', icon: 'M3 5h14v10H3zM10 5v10', ...green },
      { title: 'Which keeper made the most saves?', hint: 'Player ranking · goalkeepers', icon: 'M10 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6M4.5 16.5c0.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5', ...silver }
    ];
    return { prompts };
  }
}
</script>
</body>
</html>
