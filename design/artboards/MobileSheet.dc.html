<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile detail sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0A0D12}
a{color:#4E8EF7}a:hover{color:#7FADF9}
button:focus-visible,a:focus-visible{outline:2px solid #4E8EF7;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0D12; font-family: 'IBM Plex Sans', sans-serif; color: #F4F6F9;">
<div style="position: absolute; inset: 0;" aria-hidden="true">
<dc-import name="MobileChat" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(5,7,10,0.72);"></div>
<div role="dialog" aria-modal="true" aria-label="Match detail" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; display: flex; flex-direction: column; background: #12161D; border-top: 1px solid #3A4456; border-radius: 20px 20px 0 0; overflow: hidden; box-shadow: 0 8px 24px rgba(2,3,5,0.55);">
<div style="height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><span style="width: 36px; height: 4px; border-radius: 9999px; background: #3A4456;"></span></div>
<div style="flex-grow: 1; min-height: 0; overflow: hidden;">
<dc-import name="PanelMatch" w="{{390}}" h="{{2400}}" sheet="{{true}}" hint-size="390px,2400px"></dc-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
