[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
exclude = ["venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not llm_eval"'
markers = [
    "llm_eval: calls the real LLM through OpenRouter (opt-in: pytest -m llm_eval, needs OPENROUTER_API_KEY)",
]
